name: SolidCraft
options:
  bundleIdPrefix: ${BUNDLE_ID}
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  SolidCraftAI:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AI
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.ai
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
  SolidCraft:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - target: SolidCraftAI
        embed: true
        codeSign: true
        link: false
    sources:
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: solidcraft-ios
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Rust
        script: ./build_rust.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # MLX looks for its GPU shaders in mlx-swift_Cmlx.bundle in the app's own folder.
      - name: Copy MLX shaders
        script: cp -R "${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/"
        basedOnDependencyAnalysis: false
