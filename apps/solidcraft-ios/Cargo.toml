[package]
name = "solidcraft-ios"
description = "SolidCraft for iPad and iPhone (eframe on winit's iOS backend, wgpu/Metal)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except unsafe_code: denied, not forbidden, so that src/picker.rs can allow
# it: UIKit's document picker has no safe Rust API. Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[[bin]]
name = "solidcraft-ios"
path = "src/main.rs"

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
log = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
libc = "0.2"
serde_json = { workspace = true }
objc2-foundation = { version = "0.3", features = ["block2"] }
block2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
